

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070a12">
  <meta name="description" content="NXQ helps business owners gain greater control, clarity and confidence in running their businesses.">
  <title>NXQ — You Stay in Control</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #070a12;
      --surface: #0d1320;
      --surface-2: #111b2c;
      --white: #f5f7fb;
      --muted: #98a5b8;
      --blue: #4b9cff;
      --blue-bright: #79b7ff;
      --line: rgba(255,255,255,.10);
      --max: 1180px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: "DM Sans", sans-serif;
      line-height: 1.65;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    button { font: inherit; }

    .container {
      width: min(var(--max), calc(100% - 64px));
      margin: auto;
    }

    .eyebrow {
      color: var(--blue-bright);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .section {
      padding: 125px 0;
      position: relative;
    }

    .section-heading {
      max-width: 720px;
      margin-bottom: 58px;
    }

    .section-heading h2 {
      font-family: Manrope, sans-serif;
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1.12;
      letter-spacing: -.045em;
      margin: 17px 0;
      font-weight: 600;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 16px;
      max-width: 600px;
    }

    /* Navigation */

    header {
      position: absolute;
      z-index: 20;
      top: 0;
      left: 0;
      width: 100%;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    nav {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-family: Manrope, sans-serif;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -.09em;
    }

    .brand span { color: var(--blue); }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 34px;
      color: #c0cad8;
      font-size: 13px;
    }

    .nav-links a:hover { color: white; }

    .nav-cta {
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 3px;
      padding: 10px 17px;
      transition: .25s;
    }

    .nav-cta:hover {
      background: white;
      color: #070a12;
    }

    /* Hero */

    .hero {
      min-height: 850px;
      padding: 180px 0 110px;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 72% 38%, rgba(32,105,200,.20), transparent 38%),
        radial-gradient(ellipse at 15% 85%, rgba(28,62,115,.13), transparent 35%),
        linear-gradient(115deg, #070a12 15%, #0a1120 100%);
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 720px;
      height: 720px;
      border: 1px solid rgba(94,161,255,.09);
      border-radius: 50%;
      right: -120px;
      top: 80px;
      box-shadow:
        0 0 0 70px rgba(94,161,255,.018),
        0 0 0 140px rgba(94,161,255,.014),
        0 0 100px rgba(42,126,232,.12);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .15;
      background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(to right, transparent, black);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 790px;
    }

    .hero h1 {
      font-family: Manrope, sans-serif;
      font-size: clamp(52px, 8vw, 94px);
      line-height: .99;
      letter-spacing: -.075em;
      font-weight: 600;
      margin: 28px 0;
    }

    .hero h1 span {
      color: var(--blue-bright);
      display: block;
    }

    .hero-copy {
      max-width: 540px;
      font-size: 18px;
      color: #aab7ca;
      line-height: 1.8;
    }

    .hero-actions {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-top: 40px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 15px 23px;
      min-height: 52px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 3px;
      transition: .25s ease;
    }

    .button-primary {
      background: #f5f7fb;
      color: #080d17;
    }

    .button-primary:hover {
      background: var(--blue-bright);
      transform: translateY(-2px);
    }

    .button-outline {
      border: 1px solid rgba(255,255,255,.22);
      color: white;
    }

    .button-outline:hover {
      border-color: var(--blue);
      background: rgba(75,156,255,.08);
    }

    .hero-note {
      margin-top: 75px;
      color: #738198;
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    /* Promise */

    .promise {
      padding: 110px 0;
      background: linear-gradient(180deg, #0b1220, #0a0e18);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-align: center;
    }

    .promise-inner { max-width: 950px; margin: auto; }

    .promise h2 {
      font-family: Manrope, sans-serif;
      font-size: clamp(32px, 5.5vw, 67px);
      line-height: 1.17;
      letter-spacing: -.055em;
      font-weight: 600;
      margin: 25px 0;
    }

    .promise h2 span { color: var(--blue-bright); }

    .promise p {
      color: var(--muted);
      font-size: 16px;
      max-width: 620px;
      margin: 25px auto 0;
    }

    /* Boss */

    .boss-section {
      overflow: hidden;
      background:
        radial-gradient(ellipse at 78% 50%, rgba(38,111,205,.15), transparent 40%),
        #080d17;
    }

    .boss-layout {
      display: grid;
      grid-template-columns: 1fr .9fr;
      align-items: center;
      gap: 80px;
    }

    .boss-copy h2 {
      font-family: Manrope, sans-serif;
      font-size: clamp(42px, 6vw, 70px);
      line-height: 1.02;
      letter-spacing: -.065em;
      margin: 20px 0 25px;
    }

    .boss-copy h2 span { color: var(--blue-bright); }

    .boss-copy > p {
      color: var(--muted);
      font-size: 16px;
      max-width: 510px;
      margin-bottom: 28px;
    }

    .boss-points {
      display: grid;
      gap: 17px;
      margin: 35px 0;
    }

    .boss-point {
      display: flex;
      gap: 15px;
      align-items: flex-start;
      color: #d6deea;
      font-size: 14px;
    }

    .point-mark {
      width: 7px;
      height: 7px;
      background: var(--blue);
      border-radius: 50%;
      margin-top: 8px;
      box-shadow: 0 0 13px rgba(75,156,255,.8);
      flex-shrink: 0;
    }

    .boss-art {
      min-height: 480px;
      display: grid;
      place-items: center;
      position: relative;
    }

    .boss-orbit {
      position: absolute;
      width: 390px;
      height: 390px;
      border: 1px solid rgba(94,161,255,.20);
      border-radius: 50%;
      box-shadow: 0 0 90px rgba(40,120,225,.12), inset 0 0 70px rgba(40,120,225,.06);
    }

    .boss-orbit::before,
    .boss-orbit::after {
      content: "";
      position: absolute;
      inset: 28px;
      border: 1px solid rgba(94,161,255,.13);
      border-radius: 50%;
    }

    .boss-orbit::after { inset: 65px; }

    .boss-symbol {
      position: relative;
      z-index: 2;
      font-family: Manrope, sans-serif;
      font-size: 260px;
      font-weight: 800;
      letter-spacing: -.13em;
      line-height: 1;
      color: #eaf3ff;
      text-shadow: 0 0 70px rgba(76,153,255,.35);
      padding-right: 30px;
    }

    .boss-symbol span { color: var(--blue); }

    .boss-caption {
      position: absolute;
      bottom: 20px;
      color: #8da2bd;
      font-size: 11px;
      letter-spacing: .25em;
      text-transform: uppercase;
    }

    /* Ecosystem */

    .ecosystem {
      background: #0b101b;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .product-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    .product-card {
      min-height: 340px;
      padding: 38px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, rgba(23,39,62,.88), rgba(11,17,29,.96));
      border: 1px solid rgba(255,255,255,.10);
      transition: .3s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
      border-color: rgba(75,156,255,.45);
      box-shadow: 0 20px 60px rgba(0,0,0,.22);
    }

    .product-card::after {
      content: "";
      position: absolute;
      width: 250px;
      height: 250px;
      right: -90px;
      bottom: -130px;
      border: 1px solid rgba(75,156,255,.22);
      border-radius: 50%;
      box-shadow: 0 0 0 35px rgba(75,156,255,.025), 0 0 0 70px rgba(75,156,255,.02);
    }

    .product-label {
      color: var(--blue-bright);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .product-card h3 {
      font-family: Manrope, sans-serif;
      font-size: 37px;
      letter-spacing: -.055em;
      margin: 24px 0 12px;
    }

    .product-card p {
      color: var(--muted);
      max-width: 420px;
      font-size: 14px;
    }

    .product-arrow {
      display: inline-block;
      margin-top: 35px;
      color: #dce9fb;
      font-size: 13px;
    }

    /* Philosophy */

    .principles {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .principle {
      padding: 32px 24px;
      border-right: 1px solid var(--line);
    }

    .principle:last-child { border-right: 0; }

    .principle h3 {
      font-family: Manrope, sans-serif;
      font-size: 17px;
      margin-bottom: 8px;
    }

    .principle p {
      font-size: 12px;
      color: var(--muted);
    }

    /* Human */

    .human-section {
      background:
        radial-gradient(ellipse at 20% 50%, rgba(28,82,150,.12), transparent 42%),
        #080c15;
    }

    .human-panel {
      padding: 65px;
      border: 1px solid rgba(255,255,255,.11);
      background: linear-gradient(120deg, rgba(20,34,54,.8), rgba(9,15,26,.8));
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 70px;
      align-items: center;
    }

    .human-panel h2 {
      font-family: Manrope, sans-serif;
      font-size: clamp(32px, 4vw, 49px);
      line-height: 1.12;
      letter-spacing: -.05em;
      margin: 18px 0;
    }

    .human-panel p {
      color: var(--muted);
      font-size: 14px;
    }

    .human-statement {
      font-family: Manrope, sans-serif;
      font-size: 26px;
      line-height: 1.45;
      color: #dce9fb;
      border-left: 2px solid var(--blue);
      padding-left: 28px;
    }

    /* Closing */

    .closing {
      text-align: center;
      padding: 120px 0 130px;
      background:
        radial-gradient(ellipse at 50% 100%, rgba(40,110,205,.18), transparent 50%),
        #0a0e18;
      border-top: 1px solid var(--line);
    }

    .closing h2 {
      font-family: Manrope, sans-serif;
      font-size: clamp(40px, 6vw, 72px);
      line-height: 1.05;
      letter-spacing: -.065em;
      max-width: 800px;
      margin: 20px auto;
    }

    .closing p {
      color: var(--muted);
      margin: 20px auto 32px;
      max-width: 520px;
    }

    /* Footer */

    footer {
      padding: 35px 0;
      border-top: 1px solid var(--line);
      background: #060910;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      color: #78869a;
      font-size: 11px;
    }

    .footer-brand {
      font-family: Manrope, sans-serif;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.08em;
      color: white;
    }

    .footer-brand span { color: var(--blue); }

    /* Reveal animation */

    .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity .8s ease, transform .8s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .reveal { opacity: 1; transform: none; }
    }

    /* Responsive */

    @media (max-width: 850px) {
      .container { width: min(100% - 42px, var(--max)); }
      .hero { min-height: 760px; }
      .boss-layout { grid-template-columns: 1fr; gap: 20px; }
      .boss-art { min-height: 390px; }
      .boss-orbit { width: 310px; height: 310px; }
      .boss-symbol { font-size: 210px; }
      .human-panel { padding: 40px; gap: 35px; }
      .principles { grid-template-columns: 1fr 1fr; }
      .principle:nth-child(2) { border-right: 0; }
      .principle:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
    }

    @media (max-width: 600px) {
      .container { width: calc(100% - 38px); }
      .section { padding: 85px 0; }
      header { position: absolute; }
      nav { height: 72px; }
      .nav-links { gap: 15px; font-size: 11px; }
      .nav-links a:not(.nav-cta) { display: none; }
      .brand { font-size: 25px; }
      .hero { min-height: 760px; padding: 145px 0 80px; }
      .hero h1 { font-size: clamp(49px, 14vw, 72px); }
      .hero-copy { font-size: 16px; }
      .hero::before { right: -400px; top: 150px; }
      .hero-note { margin-top: 55px; }
      .promise { padding: 80px 0; }
      .boss-art { min-height: 320px; }
      .boss-orbit { width: 260px; height: 260px; }
      .boss-symbol { font-size: 175px; }
      .product-grid { grid-template-columns: 1fr; }
      .product-card { min-height: 290px; padding: 30px; }
      .principle { padding: 25px 17px; }
      .principle h3 { font-size: 15px; }
      .human-panel { grid-template-columns: 1fr; padding: 30px 24px; }
      .human-statement { font-size: 21px; }
      .footer-inner { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>

<body>

  <header>
    <div class="container">
      <nav aria-label="Main navigation">
        <a class="brand" href="#home" aria-label="NXQ home">NXQ<span>.</span></a>
        <div class="nav-links">
          <a href="#boss">THE BOSS</a>
          <a href="#ecosystem">OUR ECOSYSTEM</a>
          <a href="#approach">OUR APPROACH</a>
          <a class="nav-cta" href="#contact">Let's talk</a>
        </div>
      </nav>
    </div>
  </header>

  <main>

    <section class="hero" id="home">
